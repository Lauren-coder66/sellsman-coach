name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODE: mock
      DATABASE_URL: /tmp/sales-coach-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-runtime.mjs
      - run: npm audit --prefix deploy/runtime --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - run: node scripts/production-smoke.mjs
      - run: node scripts/quota-smoke.mjs
      - run: docker build -t sales-coach:ci .
      - name: Container smoke
        run: |
          set -o pipefail
          mkdir -p verify-evidence
          sh deploy/container-smoke.sh 2>&1 | tee verify-evidence/container-smoke.log
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-smoke-${{ github.sha }}
          path: verify-evidence/container-smoke.log
          if-no-files-found: ignore
          retention-days: 14

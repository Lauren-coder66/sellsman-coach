services:
  app:
    build: .
    image: sales-coach:${APP_RELEASE:-local}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      RELEASE_PROFILE: production
      DATABASE_URL: ${DATABASE_URL:-/var/lib/sales-coach/sales-coach.sqlite}
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    stop_grace_period: 105s
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=128m
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=128m
    volumes:
      - sales_data:/var/lib/sales-coach
      - sales_backups:/var/backups/sales-coach
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  sales_data:
  sales_backups:
  caddy_data:
  caddy_config:
